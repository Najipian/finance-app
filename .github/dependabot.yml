version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # arq (job queue) requires redis<6, so a redis 6 bump has no valid solution
      # and fails the whole update job. Remove once arq supports redis 6.
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # The project targets Python 3.12 (pyproject, ruff, mypy). Moving to a new
      # Python version is a deliberate change, not an automatic bump; patch
      # updates of the 3.12 image still come through.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # openapi-typescript needs the TypeScript JS API, which TypeScript 7 (native)
      # no longer ships (ADR 0005). Revisit when openapi-typescript supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node type definitions must match the Node runtime (24 in CI and Docker),
      # or code could use APIs that don't exist at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
